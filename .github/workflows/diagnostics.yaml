name: Diagnostic Run

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: "Failing test name (passed to pytest -k)"
        required: true
        type: string
      commit_sha:
        description: "Exact commit SHA to run against"
        required: true
        type: string
      repeat_count:
        description: "Number of repetitions (flakiness detection)"
        required: false
        default: "3"
        type: string

jobs:
  diagnostic:
    name: Diagnostic — ${{ inputs.test_name }}
    runs-on: ashok-test-org-aiu-x86-64-arc-runner-set
    timeout-minutes: 30
    env:
      PATH: /dev/shm/torch-spyre-venv/bin:/dev/shm/.local/bin:/dev/shm/bin:/opt/rh/gcc-toolset-14/root/usr/bin:/opt/ibm/spyre/tvm/bin:/opt/ibm/spyre/runtime/bin:/opt/ibm/spyre/deeptools/bin:/opt/ibm/spyre/senlib/bin:/opt/ibm/spyre/sentinyexec/bin:/usr/lib64/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-14/root/usr/lib64:/opt/rh/gcc-toolset-14/root/usr/lib:/opt/ibm/spyre/tvm/lib:/opt/ibm/spyre/runtime/lib:/opt/ibm/spyre/deeptools/lib:/opt/ibm/spyre/senlib/lib:/opt/ibm/spyre/sentinyexec/lib
      SENDNN_INSTALL_DIR: /opt/ibm/spyre/runtime
      SEN_COMMON_HEADERS: /opt/ibm/spyre/runtime/include
      DEEPTOOLS_INSTALL_DIR: /opt/ibm/spyre/deeptools
      SENLIB_INSTALL_DIR: /opt/ibm/spyre/senlib
      TVM_INSTALL_DIR: /opt/ibm/spyre/tvm
      RUNTIME_INSTALL_DIR: /opt/ibm/spyre/runtime
      FLEX_COMPUTE: SENTIENT
      FLEX_DEVICE: PF
      TOKENIZERS_PARALLELISM: 'false'
      VIRTUAL_ENV: /dev/shm/torch-spyre-venv
      HOME: /dev/shm
      OMP_NUM_THREADS: '192'
    steps:
      - name: Checkout specific commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Print environment info
        run: |-
          echo "Python version:"
          python3 --version
          echo "Pip version:"
          python3 -m pip --version
          echo "Working directory:"
          pwd

      - name: Install package with test dependencies
        run: |-
          python3 -m pip install --upgrade pip
          pip install -e . --no-deps --no-build-isolation -v

      - name: Run test ${{ inputs.repeat_count }}x for flakiness detection
        run: |
          for i in $(seq 1 ${{ inputs.repeat_count }}); do
            echo "=== Run $i / ${{ inputs.repeat_count }} ==="
            pytest tests/ -k "${{ inputs.test_name }}" \
              --junit-xml=pytest-results-run-$i.xml \
              -v || true
          done
        continue-on-error: true

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ inputs.test_name }}-${{ inputs.commit_sha }}
          path: pytest-results-run-*.xml
          retention-days: 30
